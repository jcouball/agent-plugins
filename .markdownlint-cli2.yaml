# What markdownlint checks. Rule settings live in .markdownlint.yml.
globs:
  - "**/*.md"
ignores:
  # Anywhere, not just at the root: a git worktree carries its own.
  - "**/node_modules"
  # Claude Code puts git worktrees here; their markdown belongs to another branch.
  - ".claude/worktrees/**"
  # Written by release-please, not by hand.
  - "plugins/*/CHANGELOG.md"
