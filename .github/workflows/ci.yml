---
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. A pull request stacked on
  # another branch needs checking just as much as one aimed at main.
  pull_request:

# Only the state after the latest push is worth checking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        run: npm run lint:manifests

      - name: Check markdown links
        run: npm run lint:links

      - name: Lint GitHub Actions workflows
        run: npm run lint:actions

      - name: Lint markdown
        run: npm run lint:markdown
