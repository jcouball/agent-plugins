---
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. A pull request stacked on
  # another branch needs checking just as much as one aimed at main.
  pull_request:

# Only the state after the latest push is worth checking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same steps as the Linux job below, on macOS, where most people who use
  # these scripts run them. A pipe write is asynchronous there, so a script that
  # exits right after printing can lose output still queued, which no test can
  # catch on Linux. lint:actions also checks the pinned macOS actionlint
  # download against its checksum for real. It is a separate job and not a
  # matrix leg of the lint job, so the name of the check the branch ruleset
  # requires does not change. It runs the tests without the coverage gate, which
  # Linux holds: the gate fails at random on macOS with every test passing, and
  # #125 replaces it. That is the one difference, and it ends there.
  lint-macos:
    name: Lint and Validate (macOS)

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the script tests
        run: npm test

      - name: Validate manifests
        run: npm run lint:manifests

      - name: Check markdown links
        run: npm run lint:links

      - name: Lint GitHub Actions workflows
        run: npm run lint:actions

      - name: Lint markdown
        run: npm run lint:markdown

  lint:
    name: Lint and Validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the script tests
        run: npm test

      - name: Validate manifests
        run: npm run lint:manifests

      - name: Check markdown links
        run: npm run lint:links

      - name: Lint GitHub Actions workflows
        run: npm run lint:actions

      - name: Lint markdown
        run: npm run lint:markdown
