---
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. A pull request stacked on
  # another branch needs checking just as much as one aimed at main.
  pull_request:

# Only the state after the latest push is worth checking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The script tests also run on macOS, where a pipe write is asynchronous and
  # a script that exits right after printing can lose output still queued. On
  # Linux the write completes first, so a test for it passes there with or
  # without the fix. It is a separate job and not a matrix leg of the lint job,
  # so the name of the check the branch ruleset requires does not change. It
  # runs the tests without the coverage gate, which Linux holds: coverage does
  # not depend on the platform, and on one run in four the macOS runner
  # reported a branch less than the tests reach.
  macos-tests:
    name: Script tests on macOS

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the script tests
        run: npm run test:run

  lint:
    name: Lint and Validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the script tests
        run: npm test

      - name: Validate manifests
        run: npm run lint:manifests

      - name: Check markdown links
        run: npm run lint:links

      - name: Lint GitHub Actions workflows
        run: npm run lint:actions

      - name: Lint markdown
        run: npm run lint:markdown
